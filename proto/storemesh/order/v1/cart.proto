syntax = "proto3";

package storemesh.order.v1;

option go_package = "storemesh-order-service/gen/storemesh/order/v1;orderv1";

service CartService {
  rpc GetCart(GetCartRequest) returns (GetCartResponse);
  rpc UpsertCart(UpsertCartRequest) returns (UpsertCartResponse);
  rpc ClearCart(ClearCartRequest) returns (ClearCartResponse);
}

message Cart { string customer_id = 1; repeated CartLine lines = 2; }
message CartLine { string product_id = 1; int64 quantity = 2; }
message GetCartRequest { string customer_id = 1; }
message GetCartResponse { Cart cart = 1; }
message UpsertCartRequest { Cart cart = 1; }
message UpsertCartResponse { Cart cart = 1; }
message ClearCartRequest { string customer_id = 1; }
message ClearCartResponse { Cart cart = 1; }
