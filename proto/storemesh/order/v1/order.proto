syntax = "proto3";

package storemesh.order.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "storemesh-order-service/gen/storemesh/order/v1;orderv1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = { post: "/v1/orders" body: "order" };
  }
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = { get: "/v1/orders/{order_id}" };
  }
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {
    option (google.api.http) = { post: "/v1/orders/{order_id}:cancel" };
  }
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_CONFIRMED = 2;
  ORDER_STATUS_CANCELLED = 3;
}

message Order {
  string order_id = 1;
  string customer_id = 2;
  repeated OrderLine lines = 3;
  int64 total_minor = 4;
  string currency = 5;
  OrderStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message OrderLine {
  string product_id = 1;
  int64 quantity = 2;
  int64 unit_price_minor = 3;
}

message CreateOrderRequest {
  Order order = 1;
  string idempotency_key = 2;
}
message CreateOrderResponse { Order order = 1; }
message GetOrderRequest { string order_id = 1; }
message GetOrderResponse { Order order = 1; }
message CancelOrderRequest { string order_id = 1; }
message CancelOrderResponse { Order order = 1; }
